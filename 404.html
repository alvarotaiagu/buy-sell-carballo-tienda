<script>
  // la 404 se sirve en cualquier ruta: la base es la carpeta de la tienda (en Pages, /<repo>/; en local, /)
  (function () {
    var m = /^\/[^/]+-tienda\//.exec(location.pathname);
    document.write('<base href="' + (m ? m[0] : '/') + '">');
  })();
</script>
